name: Deploy backend

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: {}   # "Run workflow" button for manual redeploys

# One deploy at a time; a newer merge waits rather than cancelling one mid-restart.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  id-token: write   # GitHub OIDC → AWS role
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Throwaway Postgres for the @SpringBootTest suites (they use the dev profile + a real DB).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: amldock
          POSTGRES_USER: amldock
          POSTGRES_PASSWORD: amldock
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U amldock -d amldock"
          --health-interval 5s --health-timeout 3s --health-retries 10

    # application.yml is not in the repo, so give the tests what it would have provided.
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/amldock
      SPRING_DATASOURCE_USERNAME: amldock
      SPRING_DATASOURCE_PASSWORD: amldock
      JWT_SECRET: ci-only-secret-ci-only-secret-0123456789abcdef
      AMLDOCK_OCR_ENABLED: 'false'
      AMLDOCK_NOTIFICATIONS_ENABLED: 'false'
      AWS_REGION: ap-southeast-2

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify
        working-directory: backend

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Upload jar
        run: |
          JAR=$(ls backend/target/*.jar | head -1)
          aws s3 cp "$JAR" "s3://${{ vars.ARTIFACT_BUCKET }}/backend/${GITHUB_SHA}.jar" --only-show-errors

      - name: Deploy to EC2 via SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          BUCKET: ${{ vars.ARTIFACT_BUCKET }}
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --timeout-seconds 600 \
            --parameters "commands=[\"/opt/amldock/deploy.sh $BUCKET $GITHUB_SHA\"]" \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"

          # Poll (the built-in waiter gives up after ~100 s; a cold Spring boot can take longer).
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
                       --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done

          echo "---- stdout ----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          echo "---- stderr ----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text
          echo "Status: $STATUS"
          test "$STATUS" = "Success"
