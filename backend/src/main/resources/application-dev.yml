spring:
  jpa:
    properties:
      hibernate:
        format_sql: true
  # Local-dev SMTP: Mailpit container from docker-compose. Nothing leaves the machine
  # (ISPs block outbound 25), and captured mail is readable at http://localhost:8025
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

# Actually send mail in dev (the SmtpEmailService switch reads MAIL_ENABLED).
MAIL_ENABLED: true
# Mailpit speaks SMTP, not the SES API, so dev sends one message per recipient to the local sink
# instead of one bulk call to AWS. Same templates, same per-recipient outcomes.
NOTIFICATIONS_TRANSPORT: smtp
MAIL_SMTP_AUTH: false
MAIL_SMTP_STARTTLS: false

logging:
  level:
    nz.amldock: DEBUG
    org.hibernate.SQL: DEBUG
