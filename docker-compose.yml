services:
  postgres:
    image: postgres:16-alpine
    container_name: amldock-postgres
    environment:
      POSTGRES_DB: amldock
      POSTGRES_USER: amldock
      POSTGRES_PASSWORD: amldock
    ports:
      - "5432:5432"
    volumes:
      - amldock_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amldock -d amldock"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local SMTP sink. Outbound port 25 is blocked on most ISPs, so dev mail is
  # captured here instead of relayed. Web inbox at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: amldock-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  amldock_pgdata:
